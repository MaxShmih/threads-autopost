name: Публікація постів

on:
  schedule:
    - cron: "7 * * * *"   # щогодини; час кожного поста задає поле slot у post.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Лише показати, що вийде, без публікації"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Опублікувати пости, час яких настав
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/publish.py
      - name: Зберегти статуси
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add queue
          git diff --cached --quiet || (git commit -m "Статуси публікацій $(date -u +%F\ %H:%M)" && git pull --rebase && git push)
