name: Статистика постів

on:
  schedule:
    - cron: "41 19 * * *"   # щодня близько 21:41–22:41 за Києвом
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зібрати статистику
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/insights.py
      - name: Зберегти
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add queue stats
          git diff --cached --quiet || (git commit -m "Статистика $(date -u +%F)" && git pull --rebase && git push)
